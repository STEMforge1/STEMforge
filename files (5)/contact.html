<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <title>Contact - STEMforge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #3a3a3a;
            background: linear-gradient(180deg, #d8dbdf 0%, #ced2d7 50%, #d8dbdf 100%);
            background-attachment: fixed;
        }

        header {
            background: linear-gradient(180deg, #d8dbdf 0%, #ced2d7 100%);
            color: #3a3a3a;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 3px rgba(44, 90, 160, 0.06);
        }

        .logo {
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .logo .stem { color: #2c5aa0; }
        .logo .forge { color: #d68a2e; }

        nav a {
            color: #3a3a3a;
            text-decoration: none;
            margin-left: 2.5rem;
            transition: color 0.3s;
            font-size: 0.95rem;
            font-weight: 500;
        }

        nav a:hover {
            color: #2c5aa0;
        }

        .hero {
            background: linear-gradient(135deg, #2c5aa0 0%, #3d6bb8 50%, #4a7bc4 100%);
            color: #e8e8e8;
            padding: 3rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 70%, rgba(255,255,255,0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .hero h1, .hero .subtitle, .hero p {
            position: relative;
            z-index: 1;
        }

        .cta-button {
            display: inline-block;
            background: #6b8bbf;
            color: #e8e8e8;
            padding: 0.85rem 2.5rem;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            transition: all 0.3s;
            border: 2px solid #6b8bbf;
            font-size: 0.95rem;
        }

        .cta-button:hover {
            background: #2c5aa0;
            border-color: #2c5aa0;
        }

        .section {
            padding: 5rem 2rem;
            max-width: 1100px;
            margin: 0 auto;
            background: linear-gradient(180deg, rgba(216,219,223,0) 0%, rgba(44, 90, 160, 0.03) 100%);
        }

        #about {
            padding-top: 1rem;
            padding-bottom: 1.5rem;
        }

        #subjects {
            padding-top: 1.5rem;
            padding-bottom: 3rem;
        }

        .section h2 {
            font-size: 2.2rem;
            margin-bottom: 2.5rem;
            color: #2c5aa0;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        #about h2 {
            margin-bottom: 1.3rem;
        }

        #subjects h2 {
            margin-bottom: 1.5rem;
        }

        .hero h1 {
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            font-size: 3.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            display: inline-block;
            background: #6b8bbf;
            padding: 0.4rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }

        .hero h1 .stem { color: #2c5aa0; }
        .hero h1 .forge { color: #d68a2e; }

        .hero .subtitle {
            font-size: 1.3rem;
            color: #e8e8e8;
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .hero p {
            font-size: 1.1rem;
            max-width: 650px;
            margin: 0 auto 2.5rem;
            line-height: 1.8;
            color: #e8e8e8;
        }

        .section.light-bg {
            background: linear-gradient(180deg, rgba(200, 204, 210, 0.65) 0%, rgba(190, 195, 201, 0.45) 100%);
            border-top: 1px solid rgba(44, 90, 160, 0.08);
            border-bottom: 1px solid rgba(44, 90, 160, 0.08);
        }

        .subject-card {
            background: linear-gradient(135deg, #6b8bbf 0%, #5c7cae 100%);
            color: #e8e8e8;
            padding: 1.6rem 1.5rem;
            border-radius: 4px;
            text-align: center;
            border-left: 4px solid #2c5aa0;
            box-shadow: 0 2px 8px rgba(44, 90, 160, 0.2), inset 0 1px 0 rgba(255,255,255,0.15);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .subject-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
        }

        .subject-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(44, 90, 160, 0.3), inset 0 1px 0 rgba(255,255,255,0.15);
        }

        .philosophy {
            line-height: 1.9;
            font-size: 1.05rem;
            color: #3a3a3a;
        }

        .philosophy p {
            margin-bottom: 0.9rem;
        }

        .philosophy p:last-child {
            margin-bottom: 0;
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.3rem;
            margin-top: 1.5rem;
        }
        .subject-icon {
            width: 38px;
            height: 38px;
            margin-bottom: 0.4rem;
        }

        .subject-card h3 {
            font-size: 1.3rem;
            color: #ffffff;
            font-weight: 600;
        }

        .cta-section {
            background: linear-gradient(135deg, #2c5aa0 0%, #3d6bb8 50%, #34628e 100%);
            color: #e8e8e8;
            text-align: center;
            padding: 5rem 2rem;
            position: relative;
            overflow: hidden;
            margin-top: 2rem;
        }

        .cta-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 70% 30%, rgba(255,255,255,0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        .cta-section h2, .cta-section p, .cta-section a {
            position: relative;
            z-index: 1;
        }

        .cta-section h2 {
            color: #e8e8e8;
            margin-bottom: 1.5rem;
        }

        .cta-section p {
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            color: #e8e8e8;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        footer {
            background: linear-gradient(180deg, #3a4556 0%, #2d3642 100%);
            color: #e8e8e8;
            text-align: center;
            padding: 2.5rem;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.2rem;
            }

            nav a {
                margin-left: 1rem;
            }

            header {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="stemforge-template.html" style="display: flex; align-items: center; gap: 0.3rem; text-decoration: none;">
            <img src="stemforge-logo.png" alt="STEMforge" style="height: 70px; width: auto;">
            <div class="logo"><span class="stem">STEM</span><span class="forge">forge</span></div>
        </a>
        <nav>
            <a href="stemforge-template.html#about">About</a>
            <a href="stemforge-template.html#subjects">Subjects</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="hero" style="padding: 4rem 2rem;">
        <h1 style="font-family: 'Space Grotesk', -apple-system, sans-serif; font-size: 2.8rem; font-weight: 700; background: none; padding: 0; box-shadow: none; display: block; color: #e8e8e8;">Get In Touch</h1>
        <p style="max-width: 550px;">Have a question, comment, or concern? Feel free to reach out and we'll get back to you as soon as we can.</p>
        <a href="mailto:stemforge001@gmail.com" class="cta-button">Email Us</a>
    </section>

    <section class="section" style="text-align: center; padding-top: 1.5rem;">
        <h2>Reach Us Directly</h2>
        <p style="font-size: 1.1rem; color: #3a3a3a; margin-bottom: 1rem;">Send any comments, questions, or concerns to:</p>
        <p>
            <a href="mailto:stemforge001@gmail.com" style="color: #2c5aa0; font-weight: 600; font-size: 1.3rem; text-decoration: none;">
                stemforge001@gmail.com
            </a>
        </p>
    </section>

    <footer>
        <p>&copy; 2024 STEMforge. All rights reserved.</p>
    </footer>
</body>
</html>
